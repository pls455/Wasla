name: Wasla Android Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create . --platforms=android --org=com.wasla --project-name=wasla
      - name: Install Wasla native Android bridge
        run: |
          mkdir -p android/app/src/main/kotlin/com/wasla/wasla
          cat > android/app/src/main/kotlin/com/wasla/wasla/MainActivity.kt <<'KOTLIN'
          package com.wasla.wasla

          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.drawable.Drawable
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream
          import java.io.File

          class MainActivity : FlutterActivity() {
            private val channel = "com.wasla/apps"
            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channel).setMethodCallHandler { call, result ->
                when (call.method) {
                  "listApps" -> result.success(listLaunchableApps())
                  "exportApp" -> {
                    val packageName = call.argument<String>("packageName")
                    if (packageName == null) result.error("ARGUMENT", "Missing package name", null)
                    else result.success(exportApk(packageName))
                  }
                  "getSharedContent" -> result.success(readSharedContent())
                  else -> result.notImplemented()
                }
              }
            }
            private fun listLaunchableApps(): List<Map<String, Any?>> {
              val query = packageManager.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0)
              return query.mapNotNull { info ->
                val app = info.activityInfo.applicationInfo
                try {
                  val label = app.loadLabel(packageManager).toString().ifBlank { app.packageName }
                  val icon = app.loadIcon(packageManager)
                  val size = File(app.sourceDir).length()
                  mapOf("packageName" to app.packageName, "name" to label, "size" to size, "icon" to drawableToBase64(icon))
                } catch (_: Exception) { null }
              }.distinctBy { it["packageName"] as String }.sortedBy { (it["name"] as String).lowercase() }
            }
            private fun exportApk(packageName: String): String? = try {
              val app = packageManager.getApplicationInfo(packageName, 0)
              val source = File(app.sourceDir)
              if (!source.exists() || !source.canRead()) return null
              val dir = File(cacheDir, "wasla_apps"); dir.mkdirs()
              val safe = packageName.replace(Regex("[^A-Za-z0-9._-]"), "_")
              val target = File(dir, "$safe.apk")
              source.copyTo(target, overwrite = true)
              target.absolutePath
            } catch (_: Exception) { null }
            private fun readSharedContent(): Map<String, Any?> {
              val result = mutableMapOf<String, Any?>("files" to emptyList<String>(), "text" to null)
              val files = mutableListOf<String>()
              val intent = intent ?: return result
              val text = intent.getStringExtra(Intent.EXTRA_TEXT)
              if (!text.isNullOrBlank()) result["text"] = text
              try {
                val clip = intent.clipData
                if (clip != null) for (i in 0 until clip.itemCount) clip.getItemAt(i).uri?.let { copySharedUri(it, i) }?.let(files::add)
                val stream = intent.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                if (stream != null) copySharedUri(stream, files.size)?.let(files::add)
              } catch (_: Exception) {}
              result["files"] = files
              return result
            }
            private fun copySharedUri(uri: Uri, index: Int): String? = try {
              val name = queryName(uri) ?: "shared_$index"
              val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_")
              val target = File(cacheDir, "shared_$index-$safe")
              contentResolver.openInputStream(uri)?.use { input -> target.outputStream().use { output -> input.copyTo(output) } }
              if (target.exists()) target.absolutePath else null
            } catch (_: Exception) { null }
            private fun queryName(uri: Uri): String? = try {
              contentResolver.query(uri, arrayOf(android.provider.OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c -> if (c.moveToFirst()) c.getString(0) else null }
            } catch (_: Exception) { null }
            private fun drawableToBase64(drawable: Drawable): String? = try {
              val bitmap = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
              drawable.setBounds(0, 0, 96, 96); drawable.draw(Canvas(bitmap))
              val stream = ByteArrayOutputStream(); bitmap.compress(Bitmap.CompressFormat.PNG, 90, stream)
              Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)
            } catch (_: Exception) { null }
          }
          KOTLIN
      - name: Add share sheet and network permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace(marker, marker + permissions)
          if 'android.intent.action.SEND' not in s:
              s = s.replace('</activity>', '''
                <intent-filter>
                    <action android:name="android.intent.action.SEND" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="*/*" />
                </intent-filter>
                <intent-filter>
                    <action android:name="android.intent.action.SEND_MULTIPLE" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <data android:mimeType="*/*" />
                </intent-filter>
            </activity>''', 1)
          p.write_text(s)
          PY
      - name: Normalize Dart numeric types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace("final seconds = value.inSeconds.clamp(0, 999999);", "final seconds = value.inSeconds.clamp(0, 999999).toInt();")
          s = s.replace("(p.bytes / p.total).clamp(0.0, 1.0)", "(p.bytes / p.total).clamp(0.0, 1.0).toDouble()")
          s = s.replace("server?.port", "server.port")
          p.write_text(s)
          PY
      - name: Remove generated demo test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wasla-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
